version: '3.8'

services:
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: sovereign-opensearch
    environment:
      - cluster.name=sovereign-cluster
      - node.name=sovereign-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional local API emulation using SAM Local / LocalStack
  localstack:
    image: localstack/localstack:3.0
    container_name: sovereign-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,apigateway,lambda
      - DOCKER_HOST=unix:///var/run/docker.sock
